#ce.wn::before,#ce.io::before{display:none}
#ce .dk{z-index:1}
.dc span{background:linear-gradient(145deg,#fff,#dfe3e0)!important;border:1px solid #888!important;border-radius:14%!important;box-shadow:0 .5cqw 0 #b9beba,0 1cqw 1.4cqw rgba(0,0,0,.35),inset 0 0 .8cqw rgba(255,255,255,.9),inset -.3cqw -.3cqw .8cqw rgba(0,0,0,.12)}
.dc i{background:radial-gradient(circle at 35% 30%,#555,#000 70%)!important;box-shadow:inset 0 -1px 1px rgba(255,255,255,.25)}
@keyframes dbg{0%,100%{box-shadow:0 .5cqw 0 #b9beba,0 1cqw 1.4cqw rgba(0,0,0,.35)}50%{box-shadow:0 .5cqw 0 #b9beba,0 0 3cqw 1cqw #ffc107,0 0 1cqw .5cqw #fff}}
@keyframes rl{0%{transform:rotate(0) translateY(0) scale(1)}25%{transform:rotate(100deg) translateY(-1.8cqw) scale(1.12)}50%{transform:rotate(200deg) translateY(0) scale(.95)}75%{transform:rotate(300deg) translateY(-1.3cqw) scale(1.08)}100%{transform:rotate(360deg) translateY(0) scale(1)}}
#ce .dk{background:none!important;border:0!important;box-shadow:none!important;perspective:60cqw;cursor:pointer;z-index:2}
.dki{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.dk:hover .dki,.dk.fp .dki{transform:rotateY(180deg)}
.df,.db{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:.8cqw;border:2px solid rgba(255,255,255,.85);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 2px 6px rgba(0,0,0,.35);padding:.5cqw;box-sizing:border-box}
.df{opacity:.62;letter-spacing:.1em}
.db{transform:rotateY(180deg);font-size:1.35cqw;line-height:1.2;font-weight:700;opacity:.96}
.d1k .df,.d1k .db{background:#e8c900;color:#222}
.d2k .df,.d2k .db{background:#f49030;color:#fff}
.db small{display:block;font-weight:600;opacity:.8;font-size:.85em;margin-bottom:.2cqw}
.t-jail{background:linear-gradient(135deg,#d5ead9,#b7d9c0)!important}
.t-jail .jbx{position:absolute;top:0;right:0;width:64%;height:64%;background:linear-gradient(135deg,#ffa940,#e8801a);border-left:2px solid #222;border-bottom:2px solid #222;display:flex;align-items:flex-start;justify-content:center;overflow:hidden;z-index:1}
.t-jail .jbx::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(40,25,10,.75) 0 2px,transparent 2px 22%);pointer-events:none;z-index:3;opacity:.85}
.t-jail .jbx b{font-size:clamp(5px,1.35cqw,18px);color:#fff;text-shadow:-1px -1px 0 #3a2208,1px -1px 0 #3a2208,-1px 1px 0 #3a2208,1px 1px 0 #3a2208,0 1px 3px rgba(0,0,0,.6);letter-spacing:.08em;margin-top:2px;z-index:4;position:relative}
.t-jail .jbx .tk{z-index:2;bottom:6%;gap:0;transform:scale(.8);transform-origin:bottom center}
.t-jail .jv{position:absolute;left:3%;top:8%;height:60%;writing-mode:vertical-rl;transform:rotate(180deg);font-size:clamp(5px,1.35cqw,18px);letter-spacing:.1em;color:#2f5e3d}
#ce p{color:#2b2b2b;background:rgba(255,255,255,.7);padding:1px 10px;border-radius:10px}
#ce #msg:not(.win){text-shadow:0 0 4px #fff,0 0 8px #fff}
#ce #btn button.s,#ce #btn button.big~button{background:rgba(255,255,255,.88)}
/* ---- 3D zar ---- */
.dc{gap:clamp(10px,3cqw,34px);perspective:60cqw;overflow:visible}
.dc span{--sz:clamp(34px,8cqw,90px);width:var(--sz)!important;height:var(--sz)!important;display:block!important;position:relative;padding:0!important;background:none!important;border:0!important;box-shadow:none!important;border-radius:0!important;transform-style:preserve-3d}
.dc .dsh{position:absolute;left:8%;right:8%;bottom:-10%;height:16%;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(2px);transform:translateZ(-1px)}
.dc .cube{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--ex,0deg)) rotateY(var(--ey,0deg))}
.dc .fc{position:absolute;inset:0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12%;place-items:center;background:linear-gradient(145deg,#fff,#e4e7e4);border:1px solid #9a9f9b;border-radius:16%;box-shadow:inset 0 0 .9cqw rgba(0,0,0,.14);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-sizing:border-box}
.dc .f1{transform:translateZ(calc(var(--sz)/2))}
.dc .f6{transform:rotateY(180deg) translateZ(calc(var(--sz)/2))}
.dc .f2{transform:rotateY(90deg) translateZ(calc(var(--sz)/2))}
.dc .f5{transform:rotateY(-90deg) translateZ(calc(var(--sz)/2))}
.dc .f3{transform:rotateX(90deg) translateZ(calc(var(--sz)/2))}
.dc .f4{transform:rotateX(-90deg) translateZ(calc(var(--sz)/2))}
.dc .f1 i{background:radial-gradient(circle at 35% 30%,#ff6b6b,#c62828 70%)!important;width:90%;height:90%}
.dc span.rl{animation:toss 1s linear both}
.dc #d2.rl{animation-delay:.09s}
.dc span.rl .cube{animation:tumble 1s cubic-bezier(.25,.6,.3,1) both}
.dc #d2.rl .cube{animation-delay:.09s;--k:-1}
.dc span.rl .dsh{animation:dshd 1s linear both}
.dc #d2.rl .dsh{animation-delay:.09s}
@keyframes tumble{
 0%{transform:rotateX(calc(var(--ex) + 900deg)) rotateY(calc(var(--ey) + 720deg)) rotateZ(160deg)}
 60%{transform:rotateX(calc(var(--ex) + 180deg)) rotateY(calc(var(--ey) + 180deg)) rotateZ(30deg)}
 100%{transform:rotateX(var(--ex)) rotateY(var(--ey)) rotateZ(0deg)}}
@keyframes toss{
 0%{transform:translate(var(--dx,-9cqw),-13cqw) scale(1.4);animation-timing-function:cubic-bezier(.5,0,1,.6)}
 30%{transform:translate(calc(var(--dx,-9cqw)*.25),0) scale(1);animation-timing-function:cubic-bezier(0,.4,.5,1)}
 46%{transform:translate(0,-5.5cqw) scale(1.12);animation-timing-function:cubic-bezier(.5,0,1,.6)}
 62%{transform:translate(0,0) scale(1);animation-timing-function:cubic-bezier(0,.4,.5,1)}
 75%{transform:translate(0,-2cqw) scale(1.04);animation-timing-function:cubic-bezier(.5,0,1,.6)}
 86%{transform:translate(0,0) scale(1);animation-timing-function:cubic-bezier(0,.4,.5,1)}
 93%{transform:translate(0,-.6cqw);animation-timing-function:ease-in}
 100%{transform:translate(0,0) scale(1)}}
@keyframes dshd{0%{opacity:.15;transform:translateZ(-1px) scale(.5)}30%{opacity:1;transform:translateZ(-1px) scale(1)}46%{opacity:.35;transform:translateZ(-1px) scale(.7)}62%{opacity:1;transform:translateZ(-1px) scale(1)}75%{opacity:.6;transform:translateZ(-1px) scale(.85)}86%,100%{opacity:1;transform:translateZ(-1px) scale(1)}}
#d1{--dx:-9cqw}#d2{--dx:9cqw}
@keyframes dbg{0%,100%{filter:drop-shadow(0 0 0 rgba(255,193,7,0))}50%{filter:drop-shadow(0 0 1.6cqw #ffc107) drop-shadow(0 0 .6cqw #fff)}}
.dc.dbl span:not(.rl){animation:dbg 1s ease-in-out 3}
@media(prefers-reduced-motion:reduce){.dc span.rl,.dc span.rl .cube,.dc span.rl .dsh{animation-duration:.01s}}
/* orta log okunur */
#ce #lg{background:rgba(18,22,28,.78);border-radius:10px;padding:6px 14px;max-width:92%;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#ce #lg:empty{display:none}
#ce #lg div,#ce #lg div:first-child{color:#fff;font-weight:600;text-shadow:none}
#ce #lg div:not(:first-child){color:#d9e2ec;font-weight:500}
#ce.wn #lg,#ce.wn #lg div,#ce.wn #lg div:first-child{color:#fff}
/* hapis kosesi duzeni */
.t-jail .jbx{width:66%;height:62%}

function pickLiq(p,need){

function botCounter(o,rd){

  if(ally(o.a,o.b))return '';
  const va=o.ag.reduce((s,i)=>s+T[i][2],0)+o.am,vb=o.bg.reduce((s,i)=>s+T[i][2],0)+o.bm;
  const bad=(p,give,get)=>give>0&&get<give*.5&&weak(p);
  const why=n=>n+' zor durumda: verdiği değerin en az yarısını geri almadan mülk ya da para veremez (bağış koruması).';
  if(bad(P[o.a],va,vb))return why(P[o.a].n);
  if(bad(P[o.b],vb,va))return why(P[o.b].n);
  return '';
}
/* ---- Sağ panel: oyuncular, günlük, sohbet ---- */
let chTab='l',chSeen={c:0,t:0},chSig='',chat=[],chUnsub=null,lastSend=0;
function drawPl(){
  const mp=MP&&started&&S.clk;
  const cards=P.map((p,i)=>{
    const n=T.reduce((c,_,j)=>c+(own[j]===i?1:0),0),rs=p.rs==null?RES:p.rs;
    const st=[n+' mülk',p.jail?'hapiste':'',(p.gf||[]).length?'🔓 kart':'',p.skip?'tatilde':'',p.out?'elendi':''].filter(Boolean).join(' · ');
    return '<div class="pc'+(i===cur&&!over?' on':'')+(p.out?' x':'')+'" style="--pc:'+p.c+'"><i class="pk"></i><span class="pi"><b>'+esc(p.n)+(i===me?' (sen)':'')+(TM?' ['+'AB'[i%2]+']':'')+'</b><small>'+st+'</small>'
      +(mp&&!p.bot&&!p.out?'<span class="rb" title="Süre rezervi"><span id="rb'+i+'" style="width:'+Math.round(100*Math.min(1,rs/RES))+'%"></span></span>':'')
      +'</span><span class="cs">'+Math.round(p.cash)+'₺</span></div>';
  }).join('');
  const pes=P[me]&&!P[me].out&&!over&&P.length?'<button class="sm" style="align-self:flex-start;margin:2px 0 0" onclick="sf=true;render()">🏳️ Pes Et</button>':'';
  $('#pl').innerHTML=(P.length?'<h3 class="ph">Oyuncular <button class="sm" id="sndb" title="Sesi aç/kapat" onclick="togSnd()">'+(sndOn?'🔊':'🔇')+'</button></h3>':'')+cards+pes;
  $('#rules').textContent=P.length?rulesTxt():'';
}
function vis(k){return chat.filter(m=>k==='c'?m.k==='c':(m.k==='t'&&TM&&m.tm===me%2))}
function chSub(c){
  if(chUnsub){chUnsub();chUnsub=null}
  chat=[];chSig='';
  try{chUnsub=db.collection('games/'+c+'/chat').orderBy('t').onSnapshot(sn=>{chat=sn.docs.map(d=>({...d.data(),id:d.id})).slice(-100);drawSide()},()=>{})}catch(e){}
}
function setTab(t){chTab=t;chSig='';drawSide()}
let mySig='';
function selTile(i){sel=i;io=true;render()}
function drawMy(){
  const el=$('#my');if(!el)return;
  const p=P[me];
  if(!P.length||!p){if(mySig){el.innerHTML='';mySig=''}return}
  const gk=Object.keys(G),ord=i=>T[i][3]?gk.indexOf(T[i][3]):10+(T[i][1]==='r'?0:1);
  const items=T.map((_,i)=>i).filter(i=>own[i]===me&&T[i][2]).sort((a,b)=>ord(a)-ord(b)||a-b);
  const isSet=i=>!!T[i][3]&&full(me,T[i][3]);
  const sig=me+'|'+items.map(i=>i+':'+lv[i]+(mort[i]?'m':'')+(isSet(i)?'s':'')).join(',');
  if(sig===mySig)return;mySig=sig;
  const rows=items.map(i=>{
    const t=T[i],l=lv[i]?(lv[i]<5?lv[i]+' ev':'otel'):'';
    return '<div class="mr" onclick="selTile('+i+')"><i class="sw" style="background:'+(G[t[3]]||'#9aa59f')+'"></i><span class="mn">'+esc(t[0])+'</span>'
      +(isSet(i)?'<span class="mg">SET</span>':'')+'<span class="mi">'+[l,mort[i]?'ipotekli':''].filter(Boolean).join(' · ')+'</span></div>';
  }).join('');
  el.innerHTML='<h4>Mülklerim ('+items.length+')</h4><div class="ls">'+(rows||'<div class="no">Henüz mülkün yok.</div>')+'</div>';
}
function drawSide(){
  if(!$('#tabs'))return;
  const mp=MP&&started&&!!db;
  if(!mp)chTab='l';else if(chTab==='t'&&!TM)chTab='c';
  const lc=vis('c'),lt=vis('t');
  if(chTab==='c')chSeen.c=lc.length;else if(chTab==='t')chSeen.t=lt.length;
  const sig=[chTab,mp,TM,me,lc.length,lt.length,chTab==='l'?logs.length+'|'+logs[0]:''].join('~');
  if(sig===chSig)return;chSig=sig;
  const bd=n=>n>0?'<i>'+n+'</i>':'';
  $('#tabs').innerHTML='<button class="'+(chTab==='l'?'on':'')+'" onclick="setTab(\'l\')">Günlük</button>'
    +(mp?'<button class="'+(chTab==='c'?'on':'')+'" onclick="setTab(\'c\')">Sohbet'+(chTab==='c'?'':bd(lc.length-chSeen.c))+'</button>':'')
    +(mp&&TM?'<button class="'+(chTab==='t'?'on':'')+'" onclick="setTab(\'t\')">Takım'+(chTab==='t'?'':bd(lt.length-chSeen.t))+'</button>':'');
  const cm=$('#cm');
  if(chTab==='l')cm.innerHTML=logs.map(x=>'<p class="lg">'+esc(x)+'</p>').join('')||'<p class="lg">Henüz olay yok.</p>';
  else{
    const L=chTab==='c'?lc:lt;
    cm.innerHTML=L.map(m=>{const q=P.find(x=>x.uid===m.u);return '<p><b style="color:'+(q?q.c:'#555')+'">'+esc(m.n)+':</b> '+esc(m.x)+'</p>'}).join('')||'<p class="lg">'+(chTab==='t'?'Takım sohbeti yalnızca takım arkadaşına görünür.':'Henüz mesaj yok.')+'</p>';
    cm.scrollTop=cm.scrollHeight;
  }
  $('#cf').style.display=chTab==='l'?'none':'flex';
}
function sendChat(){
  const e=$('#ci'),x=(e.value||'').trim().slice(0,200);
  if(!x||!db||!code||!P[me]||Date.now()-lastSend<800)return;
  lastSend=Date.now();e.value='';
  const k=chTab==='t'&&TM?'t':'c',id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  try{Promise.resolve(db.doc('games/'+code+'/chat/'+id).set({u:myId,n:P[me].n,t:Date.now(),x,k,tm:k==='t'?me%2:-1})).catch(()=>{})}catch(err){}
}

/* ---- Açılış ekranı: oyuncu adı ve pul rengi ---- */
const PAL=['#e63946','#2a9d8f','#e9c46a','#9b5de5','#f77f00','#4cc9f0','#2d6a4f','#ff70a6'];
const PALN=['Kırmızı','Turkuaz','Sarı','Mor','Turuncu','Gök mavisi','Koyu yeşil','Pembe'];
const DFN=['Oyuncu','Bot Kemal','Bot Ayşe','Bot Mehmet'];
let MN='',MC=PAL[0];
try{MN=localStorage.getItem('eb_nm')||'';const c0=localStorage.getItem('eb_col');if(PAL.includes(c0))MC=c0}catch(e){}
const SU={n:1,team:false,names:[MN,'','',''],cols:[MC,...PAL.filter(x=>x!==MC).slice(0,3)]};
function saveMy(){try{localStorage.setItem('eb_nm',MN);localStorage.setItem('eb_col',MC)}catch(e){}}
function swHtml(sel,taken,fn,idx,dis){
  return '<div class="sws" role="group" aria-label="Pul rengi">'+PAL.map((c,k)=>{const tk=taken.includes(c);return '<button type="button" class="sw'+(c===sel?' on':'')+(tk?' tkn':'')+'" data-c="'+c+'" style="--c:'+c+'" aria-label="'+PALN[k]+(tk&&!dis?' (başkasıyla yer değiştirir)':'')+'" aria-pressed="'+(c===sel)+'"'+(tk&&dis?' disabled':'')+' onclick="'+fn+'(\''+c+'\''+(idx===undefined?'':','+idx)+')"></button>'}).join('')+'</div>';
}
function suRender(){
  const opts=[[1,'1 rakip'],[2,'2 rakip'],[3,'3 rakip'],['t','2v2 takım']];
  $('#suN').innerHTML='<div class="lbl">Rakip sayısı</div><div class="seg" role="group">'+opts.map(([k,t])=>{const on=k==='t'?SU.team:(!SU.team&&SU.n===k);return '<button type="button" class="'+(on?'on':'')+'" aria-pressed="'+on+'" onclick="suN(\''+k+'\')">'+t+'</button>'}).join('')+'</div>';
  const n=SU.team?3:SU.n,cols=SU.team?TCL:SU.cols;
  let h='<div class="lbl">Oyuncular</div>';
  for(let i=0;i<=n;i++){
    const tag=i===0?'Sen':'Rakip '+i,tm=SU.team?(i%2?'Takım B':'Takım A'):'';
    h+='<div class="pr"><span class="pawn" style="--c:'+cols[i]+'"></span><label class="pn"><small>'+tag+(tm?' · '+tm:'')+'</small><input maxlength="14" value="'+esc(SU.names[i])+'" placeholder="'+DFN[i]+'" oninput="suName('+i+',this.value)" aria-label="'+tag+' adı"></label>'+(SU.team?'':swHtml(cols[i],cols.slice(0,n+1).filter((_,j)=>j!==i),'suCol',i))+'</div>';
  }
  if(SU.team)h+='<p class="hint">Takım renkleri sabittir: A takımı mavi tonlar, B takımı kırmızı ve turuncu.</p>';
  $('#suP').innerHTML=h;
}
function suN(k){if(k==='t'){SU.team=true;SU.n=3}else{SU.team=false;SU.n=+k}suRender()}
function suName(i,v){SU.names[i]=v;if(i===0){MN=v;saveMy()}}
function suCol(c,i){
  const j=SU.cols.findIndex((x,k)=>k!==i&&x===c);
  if(j>=0)SU.cols[j]=SU.cols[i];
  SU.cols[i]=c;MC=SU.cols[0];saveMy();suRender();
}
function startSolo(){
  const n=SU.team?3:SU.n,names=[];
  for(let i=0;i<=n;i++){
    let v=String(SU.names[i]||'').replace(/[^\p{L}\p{N} _.-]/gu,'').trim().slice(0,14)||DFN[i];
    if(names.some(x=>x.toLowerCase()===v.toLowerCase()))v=v.slice(0,12)+' '+(i+1);
    names.push(v);
  }
  start(n,SU.team,names,SU.cols);
}
function tabUI(t){
  $('#tbS').classList.toggle('on',t==='s');$('#tbM').classList.toggle('on',t==='m');
  $('#tbS').setAttribute('aria-selected',t==='s');$('#tbM').setAttribute('aria-selected',t==='m');
  $('#suS').hidden=t!=='s';$('#mp').hidden=t!=='m';
  if(t==='s')$('#st').style.display='';
}
function suTab(t){if(t==='m')mpMenu();else tabUI('s')}
function resolveCols(ms,nb){
  const used=[],out=[];
  ms.forEach(m=>{let c=PAL.includes(m.c)?m.c:null;if(!c||used.includes(c))c=PAL.find(x=>!used.includes(x));used.push(c);out.push(c)});
  for(let k=0;k<nb;k++){const c=PAL.find(x=>!used.includes(x))||PAL[0];used.push(c);out.push(c)}
  return out;
}
function mcPick(c){MC=c;saveMy();document.querySelectorAll('#mp .mf .sw').forEach(b=>{const on=b.dataset.c===c;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)})}
function lbCol(c){
  MC=c;saveMy();
  if(!db||!code||started)return;
  try{Promise.resolve(db.doc('games/'+code+'/m/'+myId).update({c})).catch(()=>{})}catch(e){}
}
function start(n,team,names,cols){setCols(!!team);
  const nm=DFN.map((d,i)=>(names&&names[i])||d);
  P=[...Array(n+1)].map((_,i)=>({i,n:nm[i],c:(!team&&cols&&cols[i])||CL[i],bot:i>0,cash:S.cash,pos:0,jail:0,out:false}));
  own=Array(40).fill(-1);lv=Array(40).fill(0);mort=Array(40).fill(false);au=null;ofr=null;tw=null;tp=null;MP=false;me=0;started=false;if(gUnsub){gUnsub();gUnsub=null}if(mUnsub){mUnsub();mUnsub=null}cur=S.rnd?Math.random()*P.length|0:0;phase='roll';dbl=0;over=false;logs=[];sel=null;dice=[1,1];
  dk={h:shuf(12),c:shuf(12)};cd=null;lastCard={h:null,c:null};TM=!!team;rm=1;um=false;bz=-1;nt=null;ntSeen=0;dp=[];mvd=new Set();lastP=P.map(p=>p.pos);sq=[];sid=0;sSeen=0;pq=[];pcur=null;clearTimeout(pTm);rej={};sf=false;vp=0;tn=0;CK=null;lastTK='';wasOver=false;debt=null;dbc=false;chTab=MP?'c':'l';chSeen={c:0,t:0};chSig='';
  $('#ov').style.display='none';$('#info').textContent='Bir kareye dokunarak bilgisini gör.';
  log('Oyun başladı. Herkes '+S.cash+'₺ ile başlıyor.'+(S.rnd?' İlk oynayan: '+P[cur].n+'.':''));tick();
}
mk();$('#stb').innerHTML=setHtml(true);suRender();drawPl();drawSide();
(async function autoJoin(){
  const m=(location.hash||'').match(/^#([A-Za-z]{4})$/);if(!m)return;
  await mpMenu();
  const c=$('#cd'),n=$('#nm');if(!c||!n)return;
  c.value=m[1].toUpperCase();
  const go=e=>{if(e.key==='Enter')mpJoin()};n.addEventListener('keydown',go);c.addEventListener('keydown',go);
  const h=document.createElement('p');h.textContent='Davet bağlantısıyla geldin. '+c.value+' odasına katılmak için takma adını yaz ve “Koda katıl”a bas.';
  $('#mp').prepend(h);n.focus();
})();

/* #tr doluyken #ce'ye trw sınıfı ekle (takas ekranında arka plan kalsın) */
(function(){const w=()=>{const t=document.getElementById('tr'),c=document.getElementById('ce');if(!t||!c)return setTimeout(w,100);const f=()=>c.classList.toggle('trw',t.childElementCount>0);new MutationObserver(f).observe(t,{childList:true});f()};w()})();
</script>
